openapi: 3.1.0
info:
    title: HealthService API
    version: 1.0.0
paths:
    /api/health/v1/list-disease-outbreaks:
        get:
            tags:
                - HealthService
            summary: ListDiseaseOutbreaks
            description: ListDiseaseOutbreaks retrieves tracked disease outbreak events.
            operationId: ListDiseaseOutbreaks
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDiseaseOutbreaksResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/health/v1/list-air-quality-alerts:
        get:
            tags:
                - HealthService
            summary: ListAirQualityAlerts
            description: ListAirQualityAlerts retrieves city-level air quality alerts.
            operationId: ListAirQualityAlerts
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAirQualityAlertsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListDiseaseOutbreaksRequest:
            type: object
            description: ListDiseaseOutbreaksRequest has no filters -- returns the full cached outbreak set.
        ListDiseaseOutbreaksResponse:
            type: object
            properties:
                outbreaks:
                    type: array
                    items:
                        $ref: '#/components/schemas/DiseaseOutbreakItem'
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Cache fetch time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                alertLevelMethodologyVersion:
                    type: string
                    description: Version identifier for the alert-level classification methodology used.
            description: ListDiseaseOutbreaksResponse contains cached disease outbreak events.
        DiseaseOutbreakItem:
            type: object
            properties:
                id:
                    type: string
                disease:
                    type: string
                location:
                    type: string
                countryCode:
                    type: string
                alertLevel:
                    type: string
                summary:
                    type: string
                sourceUrl:
                    type: string
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                sourceName:
                    type: string
                lat:
                    type: number
                    format: double
                lng:
                    type: number
                    format: double
                cases:
                    type: integer
                    format: int32
            description: DiseaseOutbreakItem represents a single tracked disease outbreak event.
        ListAirQualityAlertsRequest:
            type: object
            description: ListAirQualityAlertsRequest has no filters -- returns the full cached alert set.
        ListAirQualityAlertsResponse:
            type: object
            properties:
                alerts:
                    type: array
                    items:
                        $ref: '#/components/schemas/AirQualityAlert'
                fetchedAt:
                    type: integer
                    format: int64
                    description: 'Cache fetch time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
            description: ListAirQualityAlertsResponse contains cached city-level air quality alerts.
        AirQualityAlert:
            type: object
            properties:
                city:
                    type: string
                countryCode:
                    type: string
                lat:
                    type: number
                    format: double
                lng:
                    type: number
                    format: double
                pm25:
                    type: number
                    format: double
                    description: PM2.5 concentration in micrograms per cubic meter.
                aqi:
                    type: number
                    format: double
                    description: Air Quality Index value.
                riskLevel:
                    type: string
                pollutant:
                    type: string
                    description: Dominant pollutant driving the alert.
                measuredAt:
                    type: integer
                    format: int64
                    description: 'Measurement time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                source:
                    type: string
            description: AirQualityAlert represents a single city-level air quality alert.
