                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/analyze-stock:
        get:
            tags:
                - MarketService
            summary: AnalyzeStock
            description: AnalyzeStock retrieves a premium stock analysis report with technicals, news, and AI synthesis.
            operationId: AnalyzeStock
            parameters:
                - name: symbol
                  in: query
                  required: false
                  schema:
                    type: string
                - name: name
                  in: query
                  required: false
                  schema:
                    type: string
                - name: include_news
                  in: query
                  required: false
                  schema:
                    type: boolean
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AnalyzeStockResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/get-stock-analysis-history:
        get:
            tags:
                - MarketService
            summary: GetStockAnalysisHistory
            description: GetStockAnalysisHistory retrieves shared premium stock analysis history from the backend store.
            operationId: GetStockAnalysisHistory
            parameters:
                - name: symbols
                  in: query
                  required: false
                  schema:
                    type: string
                - name: limit_per_symbol
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: include_news
                  in: query
                  required: false
                  schema:
                    type: boolean
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetStockAnalysisHistoryResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/backtest-stock:
        get:
            tags:
                - MarketService
            summary: BacktestStock
            description: BacktestStock replays premium stock-analysis signals over recent price history.
            operationId: BacktestStock
            parameters:
                - name: symbol
                  in: query
                  required: false
                  schema:
                    type: string
                - name: name
                  in: query
                  required: false
                  schema:
                    type: string
                - name: eval_window_days
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BacktestStockResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-stored-stock-backtests:
        get:
            tags:
                - MarketService
            summary: ListStoredStockBacktests
            description: ListStoredStockBacktests retrieves stored premium backtest snapshots from the backend store.
            operationId: ListStoredStockBacktests
            parameters:
                - name: symbols
                  in: query
                  required: false
                  schema:
                    type: string
                - name: eval_window_days
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListStoredStockBacktestsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /api/market/v1/list-crypto-sectors:
        get:
            tags:
                - MarketService
            summary: ListCryptoSectors
            description: ListCryptoSectors retrieves crypto sector performance averages.
            operationId: ListCryptoSectors
            responses:
