            properties:
                iso3:
                    type: string
                name:
                    type: string
                tonnes:
                    type: number
                    format: double
                pctOfReserves:
                    type: number
                    format: double
            description: GoldCbHolder represents a central bank's gold reserve holding.
        GoldCbMover:
            type: object
            properties:
                iso3:
                    type: string
                name:
                    type: string
                deltaTonnes12m:
                    type: number
                    format: double
            description: GoldCbMover represents a central bank's recent change in gold reserves.
        GetHyperliquidFlowRequest:
            type: object
            description: GetHyperliquidFlowRequest has no filters -- returns the latest flow snapshot.
        GetHyperliquidFlowResponse:
            type: object
            properties:
                ts:
                    type: integer
                    format: int64
                    description: 'Snapshot time as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                fetchedAt:
                    type: string
                warmup:
                    type: boolean
                assetCount:
                    type: integer
                    format: int32
                assets:
                    type: array
                    items:
                        $ref: '#/components/schemas/HyperliquidAssetFlow'
                unavailable:
                    type: boolean
            description: GetHyperliquidFlowResponse contains the latest Hyperliquid perpetual futures flow snapshot.
        HyperliquidAssetFlow:
            type: object
            properties:
                symbol:
                    type: string
                display:
                    type: string
                assetClass:
                    type: string
                group:
                    type: string
                funding:
                    type: string
                    description: Funding rate, formatted as a string (source precision).
                openInterest:
                    type: string
                    description: Open interest, formatted as a string (source precision).
                markPx:
                    type: string
                    description: Mark price, formatted as a string (source precision).
                oraclePx:
                    type: string
                    description: Oracle price, formatted as a string (source precision).
                dayNotional:
                    type: string
                    description: Day notional volume, formatted as a string (source precision).
                fundingScore:
                    type: number
                    format: double
                volumeScore:
                    type: number
                    format: double
                oiScore:
                    type: number
                    format: double
                basisScore:
                    type: number
                    format: double
                composite:
                    type: number
                    format: double
                sparkFunding:
                    type: array
                    items:
                        type: number
                        format: double
                sparkOi:
                    type: array
                    items:
                        type: number
                        format: double
                sparkScore:
                    type: array
                    items:
                        type: number
                        format: double
                warmup:
                    type: boolean
                stale:
                    type: boolean
                staleSince:
                    type: integer
                    format: int64
                    description: 'Time this asset''s data went stale, as Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                missingPolls:
                    type: integer
                    format: int32
                alerts:
                    type: array
                    items:
                        type: string
            description: HyperliquidAssetFlow represents Hyperliquid perpetual futures flow data for one asset.
        ListEarningsCalendarRequest:
            type: object
            properties:
                fromDate:
                    type: string
                    description: Start date (inclusive), YYYY-MM-DD.
                toDate:
                    type: string
                    description: End date (inclusive), YYYY-MM-DD.
            description: ListEarningsCalendarRequest specifies the date range for earnings calendar retrieval.
        ListEarningsCalendarResponse:
            type: object
            properties:
                earnings:
                    type: array
                    items:
                        $ref: '#/components/schemas/EarningsEntry'
                fromDate:
                    type: string
                toDate:
                    type: string
                total:
                    type: integer
                    format: int32
                unavailable:
                    type: boolean
            description: ListEarningsCalendarResponse contains earnings events within the requested date range.
        EarningsEntry:
            type: object
            properties:
                symbol:
                    type: string
                company:
                    type: string
                date:
                    type: string
                hour:
                    type: string
                    description: Reporting time of day (e.g. "bmo", "amc").
                epsEstimate:
                    type: number
                    format: double
                revenueEstimate:
                    type: number
                    format: double
                epsActual:
                    type: number
                    format: double
                revenueActual:
                    type: number
                    format: double
                hasActuals:
                    type: boolean
                surpriseDirection:
                    type: string
                    description: Direction of the earnings surprise (e.g. "beat", "miss", "inline").
            description: |-
                EarningsEntry represents a single company's earnings report event. Estimate/actual
                 fields are optional so a missing consensus estimate can be distinguished from zero.
