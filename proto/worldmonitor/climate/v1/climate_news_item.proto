syntax = "proto3";

package worldmonitor.climate.v1;

import "sebuf/http/annotations.proto";

// ClimateNewsItem represents a single climate-related news article.
message ClimateNewsItem {
  // Unique item identifier (hash of URL).
  string id = 1;
  // Article title.
  string title = 2;
  // Article URL.
  string url = 3;
  // Name of the news source.
  string source_name = 4;
  // Publication time as Unix epoch milliseconds.
  int64 published_at = 5 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Short text summary of the article.
  string summary = 6;
}
