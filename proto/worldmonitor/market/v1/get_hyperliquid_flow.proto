syntax = "proto3";

package worldmonitor.market.v1;

import "sebuf/http/annotations.proto";

// HyperliquidAssetFlow represents Hyperliquid perpetual futures flow data for one asset.
message HyperliquidAssetFlow {
  string symbol = 1;
  string display = 2;
  string asset_class = 3;
  string group = 4;
  // Funding rate, formatted as a string (source precision).
  string funding = 5;
  // Open interest, formatted as a string (source precision).
  string open_interest = 6;
  // Mark price, formatted as a string (source precision).
  string mark_px = 7;
  // Oracle price, formatted as a string (source precision).
  string oracle_px = 8;
  // Day notional volume, formatted as a string (source precision).
  string day_notional = 9;
  double funding_score = 10;
  double volume_score = 11;
  double oi_score = 12;
  double basis_score = 13;
  double composite = 14;
  repeated double spark_funding = 15;
  repeated double spark_oi = 16;
  repeated double spark_score = 17;
  bool warmup = 18;
  bool stale = 19;
  // Time this asset's data went stale, as Unix epoch milliseconds.
  int64 stale_since = 20 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  int32 missing_polls = 21;
  repeated string alerts = 22;
}

// GetHyperliquidFlowRequest has no filters -- returns the latest flow snapshot.
message GetHyperliquidFlowRequest {
}

// GetHyperliquidFlowResponse contains the latest Hyperliquid perpetual futures flow snapshot.
message GetHyperliquidFlowResponse {
  // Snapshot time as Unix epoch milliseconds.
  int64 ts = 1 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  string fetched_at = 2;
  bool warmup = 3;
  int32 asset_count = 4;
  repeated HyperliquidAssetFlow assets = 5;
  bool unavailable = 6;
}
